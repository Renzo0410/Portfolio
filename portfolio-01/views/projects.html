<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Proyectos</title>
        <link rel="stylesheet" href="../css/index.css">
        <link rel="stylesheet" href="../css/nav.css">
        <link rel="stylesheet" href="../css/section-inicio.css">
        <link rel="stylesheet" href="../css/section-sobremi.css">
        <link rel="stylesheet" href="../css/section-proyectos.css">
        <link rel="stylesheet" href="../css/section-contact.css">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
            rel="stylesheet">
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css"
            rel="stylesheet">
    </head>
    <body>

        <!-- Navigador of projects -->
        <div id="navContainerProjects bg-white">
            <nav
                class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
                <div class="container">

                    <!-- Vista de escritorio: Menú clásico -->
                    <div class="collapse navbar-collapse w-100" id="navbarNav">
                        <ul
                            class="navbar-nav w-100 d-flex justify-content-between">
                            <li class="nav-item">
                                <a class="nav-link" href="../index.html">
                                    <i class="bi bi-arrow-left-short"></i>
                                    Volver al inicio
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="#contacto">Contacto</a>
                            </li>
                        </ul>
                    </div>

                    <!-- Vista móvil: Botones con íconos -->
                    <div class="m-auto d-lg-none d-flex gap-2 ms-auto">
                        <a href="../index.html" class="btn btn-outline-dark"
                            title="Inicio">
                            <i class="bi bi-unindent fs-1"></i>
                        </a>
                        <a href="#contacto" class="btn btn-outline-dark"
                            title="Contacto">
                            <i class="bi bi-person-lines-fill fs-1"></i>
                        </a>
                    </div>

                </div>
            </nav>
        </div>

        <!-- Section 01: More Projects -->
        <section id="proyectos"
            class="section-proyects bg-white py-5 d-flex flex-column justify-content-center min-vh-100">
            <div class="container row text-center">
                <div
                    class="col-12 m-auto container row">
                    <!-- Project: TRES EN RAYA -->
                    <div
                        class="container-card04 col-12 col-lg-6 col-xl-4">
                        <div class="card-p03 card h-100 mx-auto">
                            <img src="../img/Projects/TRES_EN_RAYA/img00.png"
                                class="card-img-top" alt="Project03">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold">TRES EN RAYA</h5>
                                <p class="card-text">
                                    Proyecto sobre el famoso juego
                                    "Tres en raya"
                                    desarrollado con la finalidad de hacer
                                    práctica
                                    de React y conocer más sobre este framework.
                                </p>

                                <!-- Tecnologías empleadas -->
                                <div
                                    class="mb-3 d-flex flex-wrap justify-content-center gap-2">
                                    <span
                                        class="tecnologyProject">HTML</span>
                                    <span
                                        class="tecnologyProject">React</span>
                                    <span
                                        class="tecnologyProject">Vite</span>
                                    <span class="tecnologyProject">CSS</span>
                                    <span
                                        class="tecnologyProject">JavaScript</span>
                                </div>

                                <!-- Contenedor para alinear botones al final -->
                                <div
                                    class="d-flex justify-content-between align-items-center gap-2">
                                    <button type="button"
                                        class="btn btn-dark w-100"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalProyecto3"
                                        title="btn+">Ver detalles
                                    </button>

                                    <a
                                        href="https://github.com/Renzo0410/Tres-en-raya"
                                        target="_blank"
                                        class="btn btn-outline-dark d-flex align-items-center justify-content-center"
                                        style="width: 45px; height: 38px;"
                                        title="btn-gth">
                                        <i class="bi bi-github fs-5"></i>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <!-- + MODAL OF PROJECTS -->
        <div id="modalContainer"></div>

        <!-- SECTION 02: CONTACT -->
        <div id="contactoContainer"></div>

        <script
            src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <script src="../js/loadsections.js"></script>
        <script src="../js/modals.js"></script>
        <script src="../js/navigator.js"></script>
    </body>
</html>
