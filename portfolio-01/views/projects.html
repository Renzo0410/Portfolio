    <body>

        <!-- Navigador of projects -->
        <div id="navContainerProjects">
            <nav
                class="navbar navbar-expand-lg navbar-dark custom-navbar fixed-top">
                <div class="container">

                    <!-- Vista de escritorio: Menú clásico -->
                    <div class="collapse navbar-collapse" id="navbarNav">
                        <ul class="navbar-nav ms-auto">
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="../index.html">
                                    <i class="bi bi-arrow-left-short"></i>Volver

                                    inicio
                                </a>
                            </li>
                            <li class="nav-item">
                                <a class="nav-link"
                                    href="#contacto">Contacto
                                </a>
                            </li>
                        </ul>
                    </div>

                    <!-- Vista móvil: Botones con íconos -->
                    <div class="m-auto d-lg-none d-flex gap-2 ms-auto">
                        <a href="../index.html" class="btn btn-outline-light"
                            title="Inicio">
                            <i class="bi bi-unindent fs-1"></i>
                        </a>
                        <a href="#contacto" class="btn btn-outline-light"
                            title="Contacto">
                            <i class="bi bi-person-lines-fill fs-1"></i>

                    </div>

                </div>
            </nav>
        </div>

        <!-- Section 01: More Projects -->
        <section id="proyectos" class="section-proyects bg-light py-5">
            <div class="container row text-center">
                <div
                    class="col-12 m-auto container row">
                    <!-- Project: TRES EN RAYA -->
                    <div
                        class="container-card04 col-12 col-lg-6 col-xl-4">
                        <div class="card-p03 card h-100 mx-auto">
                            <img src="../img/Projects/TRES_EN_RAYA/img00.png"
                                class="card-img-top" alt="Project03">
                            <div class="card-body d-flex flex-column">
                                <h5 class="card-title fw-bold">TRES EN RAYA</h5>
                                <p class="card-text">
                                    Proyecto sobre el famoso juego
                                    "Tres en raya"
                                    desarrollado con la finalidad de hacer
                                    práctica
                                    de React y conocer más sobre este framework.
                                </p>

                                <!-- Tecnologías empleadas -->
                                <div
                                    class="mb-3 d-flex flex-wrap justify-content-center gap-2">
                                    <span
                                        class="badge bg-html">HTML</span>
                                    <span
                                        class="badge bg-info bg-info-ajax">React</span>
                                    <span
                                        class="badge bg-vite">Vite</span>
                                    <span class="badge bg-primary">CSS</span>
                                    <span
                                        class="badge bg-warning">JavaScript</span>
                                </div>

                                <!-- Contenedor para alinear botones al final -->
                                <div
                                    class="mt-auto d-flex justify-content-center gap-3">
                                    <a
                                        href="https://github.com/Renzo0410/Tres-en-raya"
                                        target="blank"
                                        class="btn btn-outline-dark"
                                        title="btn-gth">
                                        <i class="bi bi-github fs-4"></i>
                                    </a>

                                    <button type="button"
                                        class="btn btn-outline-primary"
                                        data-bs-toggle="modal"
                                        data-bs-target="#modalProyecto3"
                                        title="btn+"><i
                                            class="bi bi-eye-fill fs-4"></i>
                                    </button>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>

        <!-- + MODAL OF PROJECTS -->
        <div id="modalContainer"></div>

        <div id="contactoContainer"></div>
